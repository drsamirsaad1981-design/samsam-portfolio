# temporary: raw CoinCodex rows for a few tickers (deleted after use)
name: Probe link sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-links.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s 'https://coincodex.com/api/v1/assets/get_asset_list?select_bysymbol=PUMP,PI,HYPE,TAO,WLD&limit=1000' | python3 -c "
          import json,sys; j=json.load(sys.stdin); d=j.get('data') or []
          print('rows',len(d)); print('keys', sorted(d[0].keys())[:60] if d else None)
          for x in d: print({k:x.get(k) for k in ('slug','symbol','display_symbol','name','shortname','market_cap_usd','last_market_cap_usd','not_trading_anymore')})"
          curl -s 'https://coincodex.com/api/v1/assets/get_asset_list?select_byslug=pump-fun,pi-network,hyperliquid,bittensor,worldcoin-org&limit=1000' | python3 -c "
          import json,sys; j=json.load(sys.stdin); d=j.get('data') or []
          print('byslug rows',len(d))
          for x in d: print({k:x.get(k) for k in ('slug','symbol','display_symbol','name','shortname','market_cap_usd','last_market_cap_usd','not_trading_anymore')})"
