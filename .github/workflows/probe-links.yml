# temporary: checks which public link sources answer from GitHub's servers (deleted after one run)
name: Probe link sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-links.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          p() { echo "== $1"; curl -s -m 25 -A 'Mozilla/5.0' -w '\n[http %{http_code} size %{size_download}]\n' "$1" | head -c 600; echo; }
          p 'https://api.coinmarketcap.com/data-api/v3/cryptocurrency/listing?start=1&limit=3&sortBy=market_cap&sortType=desc&convert=USD'
          p 'https://api.coinmarketcap.com/data-api/v3/map/all?listing_status=active&start=1&limit=3'
          p 'https://coincodex.com/apps/coincodex/cache/all_coins.json'
          p 'https://coincodex.com/api/v1/assets/get_asset_list?select_bysymbol=SKR'
          p 'https://www.okx.com/api/v5/public/instruments?instType=SWAP'
          p 'https://fapi.binance.com/fapi/v1/exchangeInfo'
          p 'https://api.bybit.com/v5/market/instruments-info?category=linear&limit=2'
          echo "== hyperliquid"; curl -s -m 25 -X POST -H 'content-type: application/json' -d '{"type":"meta"}' https://api.hyperliquid.xyz/info | head -c 300; echo
          p 'https://capi.coinglass.com/api/support/coin'
          p 'https://www.coinglass.com/pro/futures/LiquidationHeatMap?coin=PUMP'
          p 'https://coinmarketcap.com/currencies/pump-fun/'
          p 'https://coincodex.com/crypto/pump-fun/price-prediction/'
