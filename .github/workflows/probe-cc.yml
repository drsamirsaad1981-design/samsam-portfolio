# temporary: checks CoinCodex answers for coins without a matched page (removed after the check)
name: Probe CoinCodex
on:
  push:
    branches: [main]
    paths: ['tools/probe-cc.mjs', '.github/workflows/probe-cc.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/probe-cc.mjs
