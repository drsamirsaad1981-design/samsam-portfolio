# temporary: checks whether GitHub can read the ETF flow tables (removed after the check)
name: Probe ETF
on:
  push:
    branches: [main]
    paths: ['tools/probe-etf.mjs', '.github/workflows/probe-etf.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/probe-etf.mjs
