# tools/worker/wrangler.toml — how GitHub deploys the Worker (.github/workflows/deploy-worker.yml).
# It deploys the BUILT file only; the settings you made in the dashboard stay:
#   keep_vars   → the plain variables (ALLOWED_EMAILS, DAILY_LIMIT, …) are kept; secrets are never touched by a deploy
#   RATE        → the same KV namespace (samsam-ai-rate): the AI daily counter + the bot's language
name = "samsam-analysis"
main = "../dist/samsam-worker.js"
compatibility_date = "2026-10-16"
workers_dev = true
keep_vars = true
no_bundle = true

[[kv_namespaces]]
binding = "RATE"
id = "1702e6d9e72046d1909dcef441c27571"

# voice notes → text (Whisper, tools/worker/voice.mjs) — no key, the account's free daily allowance
[ai]
binding = "AI"

[observability]
enabled = true

# every 5 minutes: the Telegram alerts set in words (tools/worker/watch.mjs)
[triggers]
crons = ["*/5 * * * *"]
